services:
  transcription-bridge:
    build: .
    container_name: transcription-bridge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - yougile

networks:
  yougile:
    external: true
